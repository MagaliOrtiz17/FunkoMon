{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FunkoMon - {% block title %}Inicio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">FunkoMon 👾</a>
        <div class="d-flex align-items-center" id="nav-auth">
            <!-- Se rellena dinámicamente con JS -->
        </div>
    </div>
</nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');
    const navAuth = document.getElementById('nav-auth');

    if (token && username) {
        navAuth.innerHTML = `
            <span class="text-light me-3">👤 ${username}</span>
            <button class="btn btn-outline-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
        `;
    } else {
        navAuth.innerHTML = `
            <a href="/login/" class="btn btn-outline-light me-2">Iniciar Sesión</a>
            <a href="/registro/" class="btn btn-warning">Registrarse</a>
        `;
    }

    function cerrarSesion() {
        localStorage.removeItem('token');
        localStorage.removeItem('username');
        window.location.href = '/login/';
    }
</script>
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %} </body>
</html>
