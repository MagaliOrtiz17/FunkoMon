{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>

                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Nombre de Usuario (Requerido para Face ID)</label>
                    <input type="text" id="username" class="form-control" placeholder="Ej: entrenador_ash" required>
                </div>

                <hr>

                <h5 class="text-center mt-4">Ingreso Biométrico</h5>
                <div class="d-flex justify-content-center mb-3">
                    <video id="camara" width="320" height="240" autoplay class="border rounded bg-dark"></video>
                </div>

                <div class="d-grid gap-2">
                    <button id="btnLoginFace" class="btn btn-primary">📷 Escanear e Ingresar</button>
                </div>
                
                <div id="mensaje" class="mt-3 text-center fw-bold"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. Encender la cámara
    const video = document.getElementById('camara');
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("Error de cámara: " + err); });

    // 2. Lógica del Login con cara
    document.getElementById('btnLoginFace').addEventListener('click', () => {
        const username = document.getElementById('username').value;
        const msj = document.getElementById('mensaje');
        const btn = document.getElementById('btnLoginFace');

        if(!username) {
            msj.innerHTML = "<span class='text-danger'>Por favor, ingresá tu usuario primero.</span>";
            return;
        }

        btn.disabled = true;
        msj.innerHTML = "<span class='text-primary'>Validando identidad...</span>";

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        // Capturar foto
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('username', username);
            formData.append('foto', blob, 'login.jpg');

            try {
                const res = await fetch('/api/auth/face-id/login/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': csrfToken
                    }
                });
                
                const data = await res.json();

                if (res.ok) {
                    // Si da 200 OK, guardamos el token simulando una sesión real
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    msj.innerHTML = `<span class='text-success'>${data.mensaje}<br>¡Token guardado! Redirigiendo...</span>`;
                    
                    // Simulamos un inicio de sesión mandándolo al Home tras 2 segundos
                    setTimeout(() => { window.location.href = "/"; }, 2000);
                } else {
                    msj.innerHTML = `<span class='text-danger'>${data.error}</span>`;
                    btn.disabled = false;
                }
            } catch (error) {
                msj.innerHTML = `<span class='text-danger'>Error de red.</span>`;
                btn.disabled = false;
            }
        }, 'image/jpeg');
    });
</script>
{% endblock %}
