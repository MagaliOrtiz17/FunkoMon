{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="container auth-wrap">
  <div class="auth-card">
    <span class="pokeball"></span>
    <h3 class="auth-card__title">Iniciar Sesión</h3>

    {% csrf_token %}

    <div class="field">
      <label class="field__label" for="username">Usuario (requerido para Face ID)</label>
      <input type="text" id="username" class="input" placeholder="Ej: entrenador_ash" required>
    </div>

    <hr class="divider">

    <h5 class="auth-card__title" style="font-size:var(--fs-sm)">Ingreso Biométrico</h5>
    <video id="camara" class="camera" autoplay></video>

    <button id="btnLoginFace" class="btn btn--block btn--lg">📷 Escanear e Ingresar</button>

    <div id="mensaje" class="feedback"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. Encender la cámara
    const video = document.getElementById('camara');
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("Error de cámara: " + err); });

    // 2. Lógica del Login con cara
    document.getElementById('btnLoginFace').addEventListener('click', () => {
        const username = document.getElementById('username').value;
        const msj = document.getElementById('mensaje');
        const btn = document.getElementById('btnLoginFace');

        if(!username) {
            msj.innerHTML = "<span class='err'>Por favor, ingresá tu usuario primero.</span>";
            return;
        }

        btn.disabled = true;
        msj.innerHTML = "<span class='info'>Validando identidad...</span>";

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        // Capturar foto
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('username', username);
            formData.append('foto', blob, 'login.jpg');

            try {
                const res = await fetch('/api/auth/face-id/login/', {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-CSRFToken': csrfToken }
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    msj.innerHTML = `<span class='ok'>${data.mensaje}<br>¡Token guardado! Redirigiendo...</span>`;
                    setTimeout(() => { window.location.href = "/"; }, 2000);
                } else {
                    msj.innerHTML = `<span class='err'>${data.error}</span>`;
                    btn.disabled = false;
                }
            } catch (error) {
                msj.innerHTML = `<span class='err'>Error de red.</span>`;
                btn.disabled = false;
            }
        }, 'image/jpeg');
    });
</script>
{% endblock %}
