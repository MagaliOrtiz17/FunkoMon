{% extends 'base.html' %}
{% block title %}Registro{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Registro de Entrenador</h3>
                
                {% csrf_token %}

                <div class="mb-3">
                    <input type="text" id="username" class="form-control" placeholder="Nombre de usuario" required>
                </div>
                <div class="mb-3">
                    <input type="email" id="email" class="form-control" placeholder="Correo electrónico" required>
                </div>
                <div class="mb-3">
                    <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
                </div>

                <hr>
                
                <h5 class="text-center">Registro Biométrico (Face ID)</h5>
                <p class="text-muted text-center small">Mirá a la cámara y asegurate de tener buena iluminación.</p>
                
                <div class="d-flex justify-content-center mb-3">
                    <video id="camara" width="320" height="240" autoplay class="border rounded bg-dark"></video>
                </div>

                <div class="d-grid gap-2">
                    <button id="btnRegistrar" class="btn btn-success">Crear Cuenta y Registrar Rostro</button>
                </div>
                
                <div id="mensaje" class="mt-3 text-center fw-bold"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 1. Encender la cámara web apenas carga la página
    const video = document.getElementById('camara');
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("Error al acceder a la cámara: " + err); });

    // 2. Lógica al hacer clic en el botón
    document.getElementById('btnRegistrar').addEventListener('click', async () => {
        const btn = document.getElementById('btnRegistrar');
        const msj = document.getElementById('mensaje');
        
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if(!username || !password) {
            msj.innerHTML = "<span class='text-danger'>Faltan datos en el formulario.</span>";
            return;
        }

        btn.disabled = true;
        msj.innerHTML = "<span class='text-primary'>Paso 1: Creando usuario...</span>";

        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        try {
            // --- PASO 1: CREAR EL USUARIO NORMAL ---
            const resRegistro = await fetch('/api/auth/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ username, email, password })
            });
            const dataRegistro = await resRegistro.json();

            if (!resRegistro.ok) throw new Error(JSON.stringify(dataRegistro));
            
            const token = dataRegistro.token; // Guardamos la pulsera VIP
            msj.innerHTML = "<span class='text-primary'>Paso 2: Analizando rostro...</span>";

            // --- PASO 2: CAPTURAR FOTO Y MANDAR A FACE ID ---
            // Creo un canvas invisible para "sacar la foto" del video
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            // Convertimos la foto del canvas a un archivo Blob (como JPG)
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('foto', blob, 'rostro.jpg'); // Empaquetamos la foto

                const resFace = await fetch('/api/auth/face-id/register/', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Token ${token}`,
                        'X-CSRFToken': csrfToken
                    }, // Mostramos el TOKEN para que el backend sepa quién es el usuario
                    body: formData // Mandamos la foto
                });
                
                const dataFace = await resFace.json();

                if (resFace.ok) {
                    msj.innerHTML = `<span class='text-success'>¡Éxito! ${dataFace.mensaje}</span>`;
                } else {
                    msj.innerHTML = `<span class='text-danger'>Usuario creado, pero falló el FaceID: ${dataFace.error}</span>`;
                }
                btn.disabled = false;
            }, 'image/jpeg');

        } catch (error) {
            msj.innerHTML = `<span class='text-danger'>Error: ${error.message}</span>`;
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
